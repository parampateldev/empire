<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@1,600&display=swap');:root{font-family:'DM Sans',sans-serif;color:#1a1511;background:#f4eee5;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at 80% 15%,#e9cdb2 0,transparent 30%),#f4eee5;color:#1a1511}button,input,select{font:inherit}button{border:0;background:#1a1511;color:#fff;padding:16px 24px;border-radius:999px;font-weight:600;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.ghost{background:transparent;color:inherit;border:1px solid currentColor}main{min-height:100vh;display:flex;flex-direction:column}header,footer{padding:28px clamp(22px,5vw,72px);display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.14em}header a{color:inherit;text-decoration:none;font-weight:600}.hero{min-height:calc(100vh - 120px);padding:8vh clamp(22px,8vw,130px);position:relative;display:flex;flex-direction:column;justify-content:center}.crown{position:absolute;right:10%;top:16%;font-size:180px;color:#bd3e29;opacity:.15;transform:rotate(10deg)}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px}.hero h1,.lobby h2,.board h2,.card h2{font-size:clamp(64px,11vw,150px);line-height:.83;letter-spacing:-.07em;margin:25px 0;position:relative}.hero h1 em{font-family:'Playfair Display',serif;color:#bd3e29;font-weight:600}.lead{font-size:clamp(18px,2vw,25px);max-width:580px;color:#655c55}.actions{display:flex;gap:12px;margin-top:30px}.demo{font-size:12px;color:#8b7f75}.card{width:min(620px,calc(100% - 36px));margin:7vh auto;background:#fffaf3;padding:50px;border:1px solid #d8cbbd;box-shadow:15px 15px 0 #c8b9a8}.card h2{font-size:60px}.back{background:transparent;color:#1a1511;padding:0}.card label{display:block;font-size:13px;margin:22px 0}.card label b{float:right}.card input:not([type=range]){width:100%;border:0;border-bottom:1px solid #a99b8e;b
